# Camera configuration
camera_sensor_mode: 4
camera_rotation: 90
camera_framerate: 30.
camera_exposure_mode: 'sports'
camera_brightness: 38
camera_awb_mode: 'off'
camera_awb_gains: [[159, 128], [599, 256]]

# Image flip
# the bottom row of images has to flip to pu the timestamp field outside of the maze
camera_vflip: ['eye07', 'eye08', 'eye09', 'eye10', 'eye11', 'eye12']
camera_hflip: ['eye07', 'eye08', 'eye09', 'eye10', 'eye11', 'eye12']

# Frame resize. Note that frame dimensions must take rotation into account
# Sensor mode 4 of the Camera Module v2 is 1640x1232 (full field of view, 2x2 binned, up to 40 fps).
# With camera_rotation 90 that is 1232 wide by 1640 high, i.e. the native size without downscaling.
# The beholder configuration must use the same two values. Previous default: 600 x 800.
frame_width: 1232
frame_height: 1640

# Preview
camera_preview_enable: false
camera_preview_alpha: 200
camera_annotate_metadata: false
camera_annotate_frame_num: false
camera_annotate_text_size: 16
camera_annotate_bg_color: 'black'

# Capture
camera_recording_format: 'mjpeg'
camera_recording_bitrate: 25000000

# Connection
zmq_output_port: 5555
zmq_topic_video: piEye

# Debug options
debug_drop_nth_frame: false
camera_stream_duplication: 1
