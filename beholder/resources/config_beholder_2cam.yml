# Two camera setup (eye01 + eye02), shown side by side.
# The full twelve camera setup is in config_beholder_default.yml
#
# Use with `beholder -c <path to this file>`, or make it the default on a machine
# by copying it to config_beholder_local.yml

# Shape of the camera feeds
frame_width: 1232
frame_height: 1640
frame_colors: 3
frame_fps: 30.

# Display arrangement
n_rows: 1

# ZMQ frame sources
sources: ['10.0.0.101:5555',
          '10.0.0.102:5555',
          ]

# Crop and scale were calibrated at 600 x 800 and rescaled by 1232/600 for the larger frame.
# Recalibrate before relying on distance measurements.
frame_crop_x: 214
frame_crop_y: 187

scale_floor: 2.08  # mm/px
scale_arena: 1.61  # mm/px

# Video encoder for recording
#   auto:  nvenc if the custom `ffmpeg_gpu` is installed, else x264
#   nvenc: NVIDIA GPU decode + encode (needs `ffmpeg_gpu`, see docs/Installation_Beholder.md)
#   x264:  CPU encode with the stock ffmpeg (`sudo apt install ffmpeg`)
encoder: auto

# Video bitrate of the recording, per camera. Higher = sharper motion, larger files.
# 3M is roughly 1.35 GB per camera and hour (about 16 GB/h for 12 cameras).
# Still smeared when the animal runs: try 5M. Short on disk space: 2M.
record_bitrate: 3M
# ffmpeg_binary: /path/to/ffmpeg  # optional, overrides the executable of the encoder
